[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hdmi-follow"
version = "0.1.1"
description = "Follow USB ownership with LG webOS HDMI input selection"
requires-python = ">=3.12"
dependencies = ["hidapi>=0.14,<0.16", "websockets>=15,<17"]

[project.scripts]
hdmi-follow = "hdmi_follow.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9", "mypy>=1.14", "build>=1.2", "pyinstaller>=6.11"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["hid"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
